name: test

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

  # Against Uniswap's deployments on Unichain and Unichain Sepolia forks, each pinned to one block. foundry-toolchain
  # caches the fork state, so the public RPCs only serve the first run. Set the UNICHAIN_RPC_URL and
  # UNICHAIN_SEPOLIA_RPC_URL secrets to use other endpoints.
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests on Unichain
        run: forge test --mp "test/fork/*" -vv
        env:
          UNICHAIN_RPC_URL: ${{ secrets.UNICHAIN_RPC_URL || 'https://mainnet.unichain.org' }}
          UNICHAIN_SEPOLIA_RPC_URL: ${{ secrets.UNICHAIN_SEPOLIA_RPC_URL || 'https://sepolia.unichain.org' }}
