[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
# 200 keeps the hook under the 24 KB size limit. v4's Pool.swap hits "stack too deep" at some
# values (800 and 1000 do), so check PoolManager still compiles before changing this.
optimizer_runs = 200
bytecode_hash = "none"
gas_limit = "300000000"
# The testnet scripts write deployments/; the script tests write and remove a scratch file there.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "solmate/=lib/v4-core/lib/solmate/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

[fmt]
line_length = 120

[lint]
# Tests and scripts cast bounded fuzz inputs on purpose.
ignore = ["test/**/*.sol", "script/**/*.sol"]
# `poolManager` follows the v4 hook convention and is part of the public API.
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]

# Public endpoints, for `--rpc-url unichain_sepolia`. Pass a full URL to use a provider instead.
[rpc_endpoints]
unichain = "https://mainnet.unichain.org"
unichain_sepolia = "https://sepolia.unichain.org"
